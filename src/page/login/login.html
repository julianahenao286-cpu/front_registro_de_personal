<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style/registro.css">
    <title>Iniciar sesión | Registro Montessori</title>
</head>
<body>
    <main class="pagina">
        <form id="login" class="caja" novalidate>
            <img class="logo2" src="../../public/image/escudo.png" alt="Escudo Institución Educativa María Montessori">

            <div class="textos">
                <h1>Registro Montessori</h1>
                <p>Acceso exclusivo para personal autorizado</p>
            </div>

            <div class="campo">
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" autocomplete="username"
                    placeholder="Ingresa tu correo" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Ingresa tu contraseña" required>
            </div>

            <p id="mensaje-error" class="mensaje-error" role="alert" hidden></p>

            <button type="submit" class="boton" id="btn-ingresar">Iniciar Sesión</button>
        </form>
    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
