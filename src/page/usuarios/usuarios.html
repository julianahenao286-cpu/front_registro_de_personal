<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Registro Montessori</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../style/base.css">
    <link rel="stylesheet" href="../../style/usuarios.css">
</head>

<!-- hidden hasta validar la sesión (lo quita js/layout.js) -->
<body hidden>

<div class="contenedor">

    <aside class="sidebar">
        <div class="logo">
            <h2>Registro<br>Montessori</h2>
            <img src="../../public/image/escudo.png" alt="Escudo Institución Educativa María Montessori" class="escudo">
        </div>

        <ul class="menu">
            <li data-ventana="personal">
                <i class="fas fa-users" aria-hidden="true"></i>
                <span>Personal</span>
            </li>
            <li data-ventana="movimientos">
                <i class="fas fa-right-to-bracket" aria-hidden="true"></i>
                <span>Entrada / Salida</span>
            </li>
            <li data-ventana="historial">
                <i class="fas fa-clock-rotate-left" aria-hidden="true"></i>
                <span>Historial</span>
            </li>
            <li data-ventana="reportes">
                <i class="fas fa-chart-column" aria-hidden="true"></i>
                <span>Reportes</span>
            </li>
            <li class="active" aria-current="page" data-solo-admin hidden>
                <i class="fas fa-user-shield" aria-hidden="true"></i>
                <span>Usuarios</span>
            </li>
        </ul>

        <button type="button" class="btn-cerrar" aria-label="Cerrar sesión">
            <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
            <span>Cerrar Sesión</span>
        </button>
    </aside>

    <main class="principal">

        <header class="encabezado">
            <div>
                <h1>Usuarios del Sistema</h1>
                <p>Administra las cuentas que pueden iniciar sesión y su rol.</p>
            </div>
        </header>

        <div class="barra-superior">
            <input type="search" id="buscar" placeholder="Buscar por nombre o correo..." aria-label="Buscar usuario">

            <button type="button" id="boton_agregar" class="btn-primario">
                <i class="fas fa-user-plus" aria-hidden="true"></i>
                Agregar Usuario
            </button>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>

    </main>

    <div class="modal" id="modal">
        <form class="modal-contenido" id="form-usuario" novalidate>
            <h2 id="titulo-modal">Registrar Usuario</h2>
            <p>Cuenta para iniciar sesión en el sistema</p>

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa el nombre" maxlength="120" required>
            </div>

            <div class="campo">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="usuario@montessori.edu" maxlength="120"
                    autocomplete="off" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="72"
                    autocomplete="new-password">
                <p class="ayuda" id="ayuda-password">Mínimo 8 caracteres.</p>
            </div>

            <div class="campo">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required>
                    <option value="">Selecciona un rol</option>
                </select>
            </div>

            <div class="botones">
                <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-guardar" id="btn-guardar">
                    <i class="fas fa-floppy-disk" aria-hidden="true"></i>
                    <span id="texto-guardar">Registrar</span>
                </button>
            </div>
        </form>
    </div>

</div>

<script type="module" src="usuarios.js"></script>
</body>
</html>
